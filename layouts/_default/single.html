{{ define "main" }}
<article class="single-page">
  <header class="page-header">
    <h1>{{ .Title }}</h1>
    {{ if eq .Type "portfolio" }}
    <span class="page-date">{{ .Date.Format "2006" }}</span>
    {{ end }}
  </header>
  <div class="page-content{{ with .Params.text_style }}{{ if ne . "tavaline" }} text-{{ . }}{{ end }}{{ end }}">
    {{ .Content }}
  </div>
  {{ if .Params.images }}
  <div class="portfolio-images">
    {{ range .Params.images }}
    {{- $img := partial "image-item.html" . }}
    {{- if $img.url }}
    <figure>
      <img src="{{ $img.url }}" alt="{{ $img.alt | default $.Title }}" loading="lazy">
      {{- with $img.caption }}
      <figcaption>{{ . }}</figcaption>
      {{- end }}
    </figure>
    {{- end }}
    {{ end }}
  </div>
  {{ end }}
</article>
{{ end }}
