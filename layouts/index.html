{{ define "main" }}
<section class="home">
  <div class="home-intro">
    {{- $s := hugo.Data.settings | default dict }}
    <h1>{{ $s.site_title | default site.Title }}</h1>
    {{- with $s.tagline | default "Artist · Writer · Curator" }}
    <p class="tagline">{{ . }}</p>
    {{- end }}
  </div>
  {{ partial "portfolio-grid.html" (where .Site.RegularPages "Type" "portfolio") }}
</section>
{{ end }}
