backend:
  name: github
  repo: jyrishestakov-design/sandra-site
  branch: main

media_folder: "static/images"
public_folder: "/images"

locale: et
site_url: https://sandra-jogeva.netlify.app

collections:
  # ------- KUJUNDUS -------
  - name: kujundus
    label: "Kujundus"
    preview_path: "/"
    description: "Saidi värvid, fondid ja mõõdud. Salvestamisel ehitatakse sait uuesti (paar minutit)."
    files:
      - name: design
        label: "Värvid, fondid, paigutus"
        file: "data/design.yaml"
        fields:
          - { label: "Lehe taustavärv", name: bg_color, widget: color }
          - { label: "Tekstivärv", name: text_color, widget: color }
          - { label: "Lingi värv (sisutekstis)", name: link_color, widget: color }
          - { label: "Lingi hover-värv", name: link_hover, widget: color }
          - { label: "Päise taust", name: header_bg, widget: color }
          - { label: "Jaluse taust", name: footer_bg, widget: color }
          - { label: "Joonte ja ruudustiku vahede värv", name: border_color, widget: color }
          - { label: "Pealkirjade ja sisuteksti font", name: font_heading, widget: string, hint: "CSS font-family, nt 'Cormorant Garamond', Georgia, serif" }
          - { label: "Menüü ja siltide font", name: font_body, widget: string, hint: "CSS font-family, nt 'Inter', sans-serif" }
          - { label: "Google Fonts URL", name: google_fonts_url, widget: string, required: false, hint: "Kui vahetad fonti, uuenda ka see link (fonts.google.com → Get embed code → link href)" }
          - { label: "Baasfondi suurus", name: base_font_size, widget: string, hint: "nt 16px" }
          - { label: "Sisuteksti reakõrgus", name: line_height, widget: string, hint: "nt 1.8" }
          - { label: "Sisulehe laius", name: content_width, widget: string, hint: "nt 760px" }
          - { label: "Portfoolio-ruudustiku vahe", name: grid_gap, widget: string, hint: "nt 1px" }

  # ------- SAIDI SEADED -------
  - name: seaded
    label: "Saidi seaded"
    preview_path: "/"
    description: "Saidi nimi, tagline, jaluse tekst ja jagamise (SEO) andmed."
    files:
      - name: settings
        label: "Üldised seaded"
        file: "data/settings.yaml"
        fields:
          - { label: "Saidi nimi", name: site_title, widget: string, hint: "Päises ja brauseri tiitlis" }
          - { label: "Tagline (esilehel nime all)", name: tagline, widget: string, required: false }
          - { label: "Kirjeldus (SEO / jagamisel)", name: description, widget: text, required: false }
          - { label: "Jaluse tekst", name: footer_text, widget: string, hint: "{year} asendatakse jooksva aastaga" }
          - { label: "E-post", name: email, widget: string, required: false }
          - { label: "Jagamispilt (og:image)", name: og_image, widget: image, required: false, hint: "Näidatakse, kui lehel endal pilte pole (nt Facebookis jagades)" }
          - label: "Saidi keel"
            name: lang
            widget: select
            default: et
            options:
              - { label: "Eesti", value: et }
              - { label: "English", value: en }

  # ------- MENÜÜ -------
  - name: menyy
    label: "Menüü"
    preview_path: "/"
    description: "Päise menüü. Kirjeid saab lohistades ümber järjestada."
    files:
      - name: menu
        label: "Menüü kirjed"
        file: "data/menu.yaml"
        fields:
          - label: "Kirjed"
            name: items
            widget: list
            summary: "{{fields.name}} → {{fields.url}}"
            fields:
              - { label: "Nimi", name: name, widget: string }
              - { label: "Aadress (URL)", name: url, widget: string, hint: "nt /pages/bio/ või https://..." }
              - { label: "Järjekord", name: weight, widget: number, value_type: int, hint: "Väiksem number = eespool" }

  # ------- PORTFOLIO -------
  - name: portfolio
    label: "Portfoolio tööd"
    label_singular: "Töö"
    folder: "content/portfolio"
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "/portfolio/{{slug}}/"
    summary: "{{title}} ({{year}})"
    sortable_fields: [title, date]
    fields:
      - { label: "Pealkiri", name: title, widget: string }
      - { label: "Aasta / kuupäev", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true }
      - { label: "Slug (URL)", name: slug, widget: string, required: false, hint: "Muutmisel muutub veebiaadress" }
      - { label: "Tüüp", name: type, widget: hidden, default: portfolio }
      - { label: "Mustand (peidetud)", name: draft, widget: boolean, default: false }
      - { label: "Kaanepilt", name: cover, widget: image, required: false, hint: "Ruudustikus näidatav pilt. Tühjaks jättes kasutatakse esimest pilti." }
      - label: "Pildid"
        name: images
        widget: list
        required: false
        summary: "{{fields.image}} {{fields.caption}}"
        fields:
          - { label: "Pilt", name: image, widget: image }
          - { label: "Pildiallkiri", name: caption, widget: string, required: false, hint: "Näidatakse pildi all" }
          - { label: "Alt-tekst", name: alt, widget: string, required: false, hint: "Pildi kirjeldus ekraanilugejale ja otsimootorile; tühjaks jättes kasutatakse töö pealkirja" }
      - { label: "Kirjeldus", name: body, widget: markdown }

  # ------- LEHED -------
  - name: pages
    label: "Lehed (Bio, CV, Press, Kontakt)"
    label_singular: "Leht"
    folder: "content/pages"
    extension: md
    format: frontmatter
    create: true
    slug: "{{slug}}"
    preview_path: "/pages/{{slug}}/"
    fields:
      - { label: "Pealkiri", name: title, widget: string }
      - { label: "Kuupäev", name: date, widget: datetime, date_format: "YYYY-MM-DD", time_format: false, picker_utc: true, required: false }
      - { label: "Slug (URL)", name: slug, widget: string, required: false }
      - { label: "Tüüp", name: type, widget: hidden, default: page }
      - { label: "Mustand (peidetud)", name: draft, widget: boolean, default: false }
      - { label: "Sisu", name: body, widget: markdown }
